[package]
name = "serde_perl_dumper"
version = "0.1.0"
authors = ["Dylan Hardison <dylan@hardison.net>"]
description = "A Serde implementation for Perl data structures"
keywords = ["serde", "perl", "serialization"]
license = "MIT"
repository = "https://github.com/dylanwh/serde_perl"

edition = "2021"

[dependencies]
beef = "0.5.2"
bon = "3.10.3"
itoa = "1.0.11"
memchr = "2.8.3"
ryu = "1.0.18"
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "1.0.61"
winnow = "1.0.4"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parse"
harness = false
